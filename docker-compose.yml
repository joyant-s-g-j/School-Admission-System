services:
  db:
    image: postgres:16-alpine
    container_name: school-admission-db
    environment:
      POSTGRES_DB: schooladmission
      POSTGRES_USER: schooladmin
      POSTGRES_PASSWORD: school1234
    ports:
      - "5432:5432"
    volumes:
      - school_admission_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schooladmin -d schooladmission"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/SchoolAdmission
      dockerfile: Dockerfile
    container_name: school-admission-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=schooladmission;Username=schooladmin;Password=school1234"
      HOLD_DURATION_SECONDS: 600
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: school-admission-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  school_admission_data:
    name: school_admission_data